name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using: $ZIP"
          unzip -q -o "$ZIP" -d unpacked
          ls unpacked

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: unpacked/flashcards_app
        run: |
          # flutter create قد يستبدل ملفاتنا، لذلك نحتفظ بنسخة ونعيدها
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create . --project-name flashcards_app --org com.example --platforms=android
          rm -rf lib test
          cp -r /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml

      - name: Configure Android (permissions, notifications)
        working-directory: unpacked/flashcards_app
        run: python3 tools/setup_android.py

      - name: Install dependencies
        working-directory: unpacked/flashcards_app
        run: flutter pub get

      - name: Analyze (does not fail the build)
        working-directory: unpacked/flashcards_app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: unpacked/flashcards_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flashcards-apk
          path: unpacked/flashcards_app/build/app/outputs/flutter-apk/app-release.apk
